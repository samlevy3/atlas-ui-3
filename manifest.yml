---
applications:
  - name: atlas-api
    memory: 768M
    disk_quota: 4G
    instances: 1
    buildpacks:
      - python_buildpack
    command: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    health-check-type: http
    health-check-http-endpoint: /api/health
    timeout: 180
    env:
      LOG_LEVEL: "INFO"
      ENVIRONMENT: "production"
      DEBUG_MODE: "false"
      # Don’t set PORT; CF sets it.
    routes:
      - route: atlas-api.app.cloud.gov
