---
applications:
  - name: atlas-ui
    path: frontend
    memory: 256M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - nodejs_buildpack
    # Typical Node buildpack expects a start script in frontend/package.json
    # command: npm start
    routes:
      - route: atlas-ui.app.cloud.gov

  - name: atlas-api
    path: backend
    memory: 1G
    disk_quota: 2G
    instances: 1
    buildpacks:
      - python_buildpack
    # Prefer a production web server if you can (example):
    # command: gunicorn -b 0.0.0.0:$PORT main:app
    command: python main.py
    health-check-type: http
    health-check-http-endpoint: /api/health
    timeout: 180
    env:
      LOG_LEVEL: "INFO"
      ENVIRONMENT: "production"
      DEBUG_MODE: "false"
      # Don’t set PORT; CF sets it.
    routes:
      - route: atlas-api.app.cloud.gov
